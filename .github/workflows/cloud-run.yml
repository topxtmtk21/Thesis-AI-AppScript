name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r backend/requirements-dev.txt

    - name: Run tests
      run: cd backend && pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Google Cloud Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Authorize Docker push
      run: gcloud auth configure-docker

    - name: Build and Push Docker image
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/academic-ai-backend

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy academic-ai-backend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/academic-ai-backend \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --min-instances 1 \
          --max-instances 5 \
          --concurrency 20 \
          --timeout 900 \
          --cpu-boost \
          --set-env-vars BACKEND_SHARED_SECRET=${{ secrets.BACKEND_SHARED_SECRET }},BACKEND_CORS_ORIGINS=${{ secrets.BACKEND_CORS_ORIGINS }},MAX_CONCURRENT_JOBS=3,MAX_QUEUED_JOBS=100,JOB_RESULT_TTL_SECONDS=86400
